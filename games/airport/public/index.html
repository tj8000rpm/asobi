<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c4edf4">
  <meta name="description" content="すきな滑走路をタップして、飛行機を着陸させよう。幼児向けの小さな空港あそび。">
  <title>ちいさな くうこう</title>
  <link rel="stylesheet" href="style.css">
  <script src="simulation.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game" aria-label="ちいさな くうこう">
    <header class="toolbar" aria-label="空港の状況と操作">
      <div class="toolbar-info">
        <h1 class="game-title"><span>ちいさな</span> <span>くうこう</span></h1>
      <div class="stats">
        <span class="stat score" aria-label="スコア"><span aria-hidden="true">★</span><strong id="score">0</strong></span>
        <span class="stat" aria-label="着陸した回数"><span aria-hidden="true">✈</span><strong id="count">0</strong></span>
        <span class="stat" aria-label="上空待機数"><span aria-hidden="true">⟳</span><strong id="waiting-count">0</strong></span>
      </div>
      </div>
      <div class="tools">
        <button id="sound" class="tool sound" type="button" aria-label="音をオンにする" aria-pressed="false"><span aria-hidden="true">♪</span><span id="sound-label" class="sr-only">OFF</span></button>
        <button id="pause" class="tool" type="button" aria-label="一時停止する" aria-pressed="false">Ⅱ</button>
        <details class="help">
          <summary class="tool" aria-label="遊び方">?</summary>
          <div class="help-content"><h2>あそびかた</h2><p>みているだけでも ひこうきが おりてくるよ。</p><p>✈ ひこうき → A・B・C・D をタッチして あんない！</p><p>あいてる かっそうろへ ★10<br>おすすめの かっそうろへ ★20<br>たいきしている ひこうきは さらに ★5</p><p class="help-legend">★ スコア　✈ ちゃくりく　⟳ たいき</p></div>
        </details>
      </div>
    </header>
    <section class="airport" aria-label="飛行機と滑走路">
      <div class="sr-only"><span id="message" role="status" aria-live="polite"></span><span id="hint"></span></div>
      <template id="plane-art"><svg viewBox="0 0 160 180" aria-hidden="true"><ellipse cx="80" cy="94" rx="65" ry="13" fill="#354c61" opacity=".09"/><path d="M69 83 17 117Q10 123 14 132L68 114 72 148 49 164 49 172 80 163 111 172 111 164 88 148 92 114 146 132Q150 123 143 117L91 83Z" fill="var(--plane-color)"/><path d="M69 84C68 54 69 13 80 8 91 13 92 54 91 84L87 150Q80 159 73 150Z" fill="#fffdf7"/><path d="M70 47Q80 36 90 47L89 57Q80 50 71 57Z" fill="#34576d"/><path d="M74 25Q80 18 85 29" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M80 116V148" stroke="#e4e9e7" stroke-width="3" stroke-linecap="round"/><g fill="#9bcad6"><rect x="71" y="64" width="4" height="7" rx="2"/><rect x="85" y="64" width="4" height="7" rx="2"/><rect x="71" y="76" width="4" height="7" rx="2"/><rect x="85" y="76" width="4" height="7" rx="2"/></g><circle cx="18" cy="125" r="3" fill="#ffbc99"/><circle cx="142" cy="125" r="3" fill="#9dd9be"/></svg></template>
      <svg class="airport-map" viewBox="0 0 1000 1400" preserveAspectRatio="none" aria-label="東京湾と4本の滑走路の空港マップ">
        <defs>
          <linearGradient id="sea-colors" x1="0" y1="0" x2=".35" y2="1">
            <stop offset="0" stop-color="#c7eaf0"/><stop offset=".5" stop-color="#b5dfe6"/><stop offset="1" stop-color="#9fcfdc"/>
          </linearGradient>
          <radialGradient id="sea-light" cx=".75" cy=".2" r=".8">
            <stop offset="0" stop-color="#fffaf0" stop-opacity=".35"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="island-colors" x1="0" y1="0" x2=".3" y2="1">
            <stop offset="0" stop-color="#f1efd5"/><stop offset="1" stop-color="#dbe5be"/>
          </linearGradient>
          <pattern id="sea" width="75" height="65" patternUnits="userSpaceOnUse"><path d="M8 36q12 -8 24 0t24 0" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/></pattern>
          <pattern id="blocks" width="50" height="45" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="28" height="25" rx="3" fill="#b9c9b6"/><path d="M0 42H50M45 0V45" stroke="#e3e7d7" stroke-width="5"/></pattern>
        </defs>
        <rect width="1000" height="1400" fill="url(#sea-colors)"/><rect width="1000" height="1400" fill="url(#sea-light)"/><rect width="1000" height="1400" fill="url(#sea)"/>
        <path d="M0 0H360L325 160 245 240 265 340 165 440 185 560 95 700 50 960 0 1040Z" fill="#cbd8bf"/>
        <path d="M0 0H275L245 165 165 275 180 365 75 470 100 550 0 710Z" fill="url(#blocks)"/>
        <path d="M108 636 445 492 616 620 666 1030 488 1155 190 1090 135 895Z" fill="url(#island-colors)" stroke="#f9f4dd" stroke-width="8"/>
        <path d="M525 1190 835 1035 894 1125 580 1287Z" fill="url(#island-colors)" stroke="#f9f4dd" stroke-width="8"/>
        <path d="M480 1065 580 1195" stroke="#f3edce" stroke-width="23"/>
        <g fill="none" stroke="#c9cdb7" stroke-width="15" stroke-linejoin="round"><path d="M300 1020 220 725 470 600M560 970 478 700M290 940 510 880M420 860 465 1000 600 1170 790 1080"/></g>
        <g fill="none" stroke="#f7f0c9" stroke-width="2" stroke-dasharray="8 8"><path d="M300 1020 220 725 470 600M560 970 478 700M290 940 510 880M420 860 465 1000 600 1170 790 1080"/></g>
        <g class="terminals"><rect x="330" y="760" width="35" height="165" rx="9" transform="rotate(-16 347 840)"/><rect x="415" y="735" width="35" height="165" rx="9" transform="rotate(-16 432 820)"/><rect x="205" y="930" width="65" height="30" rx="8"/><text x="341" y="848">T1</text><text x="427" y="823">T2</text><text x="220" y="952">T3</text></g>
        <g class="map-labels"><text x="90" y="240">とうきょう</text><text x="760" y="970">とうきょうわん</text><text x="385" y="1060">はねだ</text><text x="56" y="100">N ↑</text></g>
        <g id="route-guides" fill="none"></g>
        <ellipse cx="760" cy="160" rx="130" ry="140" class="holding-guide"/>
        <text x="760" y="165" class="holding-label">じょうくう たいき</text>
        <g id="map-runways"></g>
        <path id="selected-route" class="selected-route" fill="none"/>
      </svg>
      <div id="traffic" aria-label="航路を飛ぶ飛行機"></div>
      <div id="celebration" class="celebration" aria-hidden="true"></div>
      <div id="arrival" class="arrival" aria-hidden="true"><span>✦</span> じょうずに できたね！ <span>✦</span></div>
    </section>
      <div class="runway-panel" aria-label="案内する滑走路">
<button class="runway" data-runway="0" type="button"><span class="runway-number">A</span><span class="runway-status sr-only">あいてる</span><span class="runway-name">16R</span></button>
<button class="runway" data-runway="1" type="button"><span class="runway-number">B</span><span class="runway-status sr-only">あいてる</span><span class="runway-name">22</span></button>
<button class="runway" data-runway="2" type="button"><span class="runway-number">C</span><span class="runway-status sr-only">あいてる</span><span class="runway-name">16L</span></button>
<button class="runway" data-runway="3" type="button"><span class="runway-number">D</span><span class="runway-status sr-only">あいてる</span><span class="runway-name">23</span></button>
      </div>

  </main>
</body>
</html>

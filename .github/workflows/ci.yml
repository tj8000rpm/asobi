name: Test, build and publish games

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test build tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test games in browser
        run: python3 scripts/test_browser.py --browser /usr/bin/google-chrome
      - name: Build static files
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: games-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Package GitHub Pages site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4e7">
  <title>ちいさな あそびば</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: 40px 20px; background: linear-gradient(145deg,#fff3df,#edf5e8 55%,#dceff3); color: #46675e; font-family: "Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
    main { max-width: 560px; margin: auto; }
    header { padding: 20px 0 28px; }
    h1 { font-size: 25px; letter-spacing: .06em; margin: 0 0 12px; color: #548d87; }
    header p { font-size: 13px; color: #82958a; }
    .games { display: grid; gap: 15px; }
    .game-card { display: flex; align-items: center; gap: 16px; padding: 22px 18px; border: 2px solid #fff; border-radius: 23px; background: linear-gradient(125deg,#fffdf6,#f8f9ec); color: inherit; text-decoration: none; box-shadow: 0 5px 0 #b8cebb35; }
    .game-card:focus-visible { outline: 3px solid #558a90; outline-offset: 4px; }
    .game-icon { font-size: 36px; color: #df927d; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    .game-card p { font-size: 12px; line-height: 1.8; margin: 0; color: #7f9289; }
    .arrow { margin-left: auto; color: #88a69b; font-size: 24px; }
  </style>
</head>
<body>
  <main>
    <header><h1>ちいさな あそびば</h1><p>すきな あそびを えらんでね。</p></header>
    <nav class="games" aria-label="ゲーム一覧"><!-- GAME_CARDS --></nav>
  </main>
</body>
</html>
